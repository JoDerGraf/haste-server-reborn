<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex,nofollow" />
		<title>hastebin</title>

		<link rel="stylesheet" type="text/css" href="/solarized_dark.css" />
		<link rel="stylesheet" type="text/css" href="/application.css" />
		<link rel="icon" href="/favicon.ico" />

		<script src="/vendor/highlight.min.js" defer></script>
		<script src="/application.js" defer></script>
	</head>

	<body>
		<ul id="messages"></ul>

		<div id="key">
			<div id="pointer" hidden></div>
			<div id="box1">
				<a href="/about.md" class="logo" aria-label="About hastebin"></a>
			</div>
			<div id="box2">
				<button class="save function button-picture">Save</button>
				<button class="new function button-picture">New</button>
				<button class="duplicate function button-picture">Duplicate &amp; Edit</button>
				<button class="raw function button-picture">Just Text</button>
				<button class="twitter function button-picture">Twitter</button>
			</div>
			<div id="box3" hidden>
				<div class="label"></div>
				<div class="shortcut"></div>
			</div>
		</div>

		<div id="linenos"></div>
		<pre id="box" class="hljs" tabindex="0" hidden><code></code></pre>
		<textarea spellcheck="false" aria-label="Paste content" hidden></textarea>
	</body>

</html>
